name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MXHostSwitch-windows-x64.exe
          - os: ubuntu-22.04
            artifact: MXHostSwitch-linux-x64
          - os: macos-13
            artifact: MXHostSwitch-macos-x64.zip
          - os: macos-14
            artifact: MXHostSwitch-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev \
            libgirepository1.0-dev libcairo2-dev pkg-config \
            gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1

      - name: Install Python deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build
        run: python scripts/build.py

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item dist/MXHostSwitch.exe "${{ matrix.artifact }}"

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cp dist/MXHostSwitch "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          if [ -d dist/MXHostSwitch.app ]; then
            ditto -c -k --keepParent dist/MXHostSwitch.app "${{ matrix.artifact }}"
          else
            mkdir -p stage
            cp dist/MXHostSwitch stage/MXHostSwitch
            chmod +x stage/MXHostSwitch
            ditto -c -k stage "${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la artifacts
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "MX Host Switch ${GITHUB_REF_NAME}" --notes-file - <<'EOF'
          Ready-to-run builds. No Python, no compile.

          | File | Platform |
          | --- | --- |
          | `MXHostSwitch-windows-x64.exe` | Windows 10/11 (64-bit) |
          | `MXHostSwitch-linux-x64` | Linux x86_64 |
          | `MXHostSwitch-macos-x64.zip` | macOS Intel |
          | `MXHostSwitch-macos-arm64.zip` | macOS Apple Silicon |

          **Windows:** if SmartScreen appears, More info → Run anyway.

          **macOS:** right-click the app → Open (Gatekeeper).

          **Linux:** `chmod +x MXHostSwitch-linux-x64` then run it. Tray needs a desktop session with AppIndicator/GTK. HID access may need your user in the `plugdev` group, or a udev rule for vendor `046d`.

          Tested with MX Anywhere 2. Other Logitech Easy-Switch mice should work.
          EOF
          gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
